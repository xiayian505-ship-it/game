<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FreeCell｜玩家最愛局｜接龍帝國</title>
  <link rel="stylesheet" href="freecell_favorites.css">
  <link rel="stylesheet" href="freecell_favorites_style.css">
</head>
<body>
  <main class="collection-shell">
    <header class="collection-header">
      <div class="empire-title-group">
        <div class="suit-seal" aria-hidden="true">♥</div>
        <div class="empire-title-copy">
          <p class="collection-kicker">秘藏之谷</p>
          <h1>自由之都</h1>
        </div>
      </div>
      <div class="empire-header-actions"><a class="collection-return" href="../favorites.html">返回</a></div>
    </header>
    <div class="collection-toolbar"><p class="collection-note">點擊牌局即可進入自由之都，從頭開始該局。</p><button id="refreshButton" type="button">重新整理</button></div>
      <div id="collectionTabs" class="collection-tabs-shell" data-slowly-tabs>
        <nav class="collection-tabs" role="tablist" aria-label="FreeCell 館藏類別">
          <button type="button" role="tab" data-view-target="freecell" aria-selected="true">自由之都</button>
          <button type="button" role="tab" data-view-target="microsoft" aria-selected="false">百萬牌局</button>
        </nav>
        <section class="collection-panel" data-view-panel="freecell">
          <div class="panel-meta"><span>共 <strong id="freecellCount">—</strong> 局</span><span id="freecellStatus" class="status-text" aria-live="polite"></span></div>
          <div id="freecellList" class="record-list" aria-label="FreeCell｜玩家最愛局"></div>
          <nav class="pager" id="freecellPager" aria-label="FreeCell｜玩家最愛局分頁" hidden>
            <button id="freecellPrev" type="button">上一頁</button>
            <span id="freecellPageInfo" class="page-info">1 / 1</span>
            <button id="freecellNext" type="button">下一頁</button>
          </nav>
        </section>
        <section class="collection-panel" data-view-panel="microsoft" hidden>
          <div class="panel-meta"><span>共 <strong id="microsoftCount">—</strong> 局</span><span id="microsoftStatus" class="status-text" aria-live="polite"></span></div>
          <div id="microsoftList" class="record-list" aria-label="微軟百萬牌局最愛"></div>
          <nav class="pager" id="microsoftPager" aria-label="微軟百萬牌局最愛分頁" hidden>
            <button id="microsoftPrev" type="button">上一頁</button>
            <span id="microsoftPageInfo" class="page-info">1 / 1</span>
            <button id="microsoftNext" type="button">下一頁</button>
          </nav>
        </section>
      </div>
  </main>
  <script src="https://lib.stillnessbyslowly.com/fiction/Fiction_paginate.js"></script>
  <script src="https://lib.stillnessbyslowly.com/ui/tabs/tabs.js"></script>
  <script src="../../collection_store.js"></script>
  <script src="freecell_favorites.js"></script>
  <script src="freecell_favorites_style.js"></script>
</body>
</html>
