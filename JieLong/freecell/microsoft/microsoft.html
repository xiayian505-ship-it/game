<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自由之都｜Microsoft 編號牌局</title>

  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/typography/shine_text.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/celebration/confetti_burst.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/celebration/gold_rain.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/celebration/star_explosion.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/celebration/shockwave.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/celebration/flash_shake.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/celebration/jackpot_pop.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/celebration/card_rain.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/celebration/victory_beam.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/celebration/classic_fireworks.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/ui/favorite.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/ui/toast.css">
  <link rel="stylesheet" href="./freecell.css">
  <link rel="stylesheet" href="./freecell_style.css?v=20261008-headerhud">
  <link rel="stylesheet" href="./microsoft_style.css?v=20261008-headerhud">
</head>
<body>
  <main id="gameShell" class="game-shell">
    <header class="game-header">
      <div class="empire-title-group">
        <div class="suit-seal" aria-hidden="true">♣</div>
        <div class="empire-title-copy">
          <p class="eyebrow eyebrow-with-stat"><span>自由之都 <span>FreeCell</span></span><span class="city-solved-stat">本機已解：<strong id="solvedDealCount">0</strong></span></p>
          <h1>Microsoft 編號牌局</h1>
          <div class="subtitle empire-status-line">
            <span>步數：<strong id="moveCount">0</strong></span>
            <div id="currentDealIdentity" class="deal-identity" hidden>
              <div class="deal-id-left">
                <button id="favoriteDealToggle" class="slowly-favorite" type="button" data-slowly-favorite aria-pressed="false" aria-label="最愛牌局" title="最愛牌局">☆</button>
                <span><strong id="currentDealShortUid">#──────</strong></span>
                <button id="copyDealUidButton" class="copy-deal-id-button copy-icon-button" type="button" aria-label="複製牌局編號" title="複製牌局編號"><canvas class="copy-icon-canvas" width="24" height="24" aria-hidden="true"></canvas></button>
              </div>
            </div>
          </div>
          <div id="currentDealStats" class="deal-stats header-deal-stats" hidden aria-live="polite">
            <span id="currentDealBest" class="deal-best" hidden>最佳：<strong id="currentDealBestSteps">—</strong> 步</span>
            <span id="currentDealClears" class="deal-clears" hidden>破關：<strong id="currentDealClearCount">—</strong> 次</span>
          </div>
        </div>
      </div>

      <div class="empire-header-actions" aria-label="自由之都操作">
        <button id="restartButton" class="restart-button" type="button">入境</button>
        <button id="leaveFreeCellButton" class="leave-freecell-button" type="button">離境</button>
      </div>
    </header>

    <span id="completedCount" hidden>0</span>
    <span id="freeCellCount" hidden>0</span>

    <section class="top-row" aria-label="自由寄放格與本位回收格">
      <div class="slot-zone freecell-zone">
        <div id="freeCellArea" class="completed-area freecell-area" aria-label="四個自由寄放格"></div>
        <p class="slot-zone-label">自由寄放格</p>
      </div>
      <div class="slot-zone foundation-zone">
        <p class="slot-zone-label">本位回收格</p>
        <div id="completedArea" class="completed-area foundation-area" aria-label="四個本位回收格"></div>
      </div>
    </section>

    <p id="notice" class="notice" hidden></p>

    <section id="tableau" class="tableau" aria-label="八欄牌區"></section>
  </main>

  <div id="bombOverlay" class="bom-overlay" aria-hidden="true">
    <div id="victoryParticles" class="victory-particles" aria-hidden="true"></div>
    <div class="bom-card">
      <div id="bombText" class="bom-text slowly-shine-text">牌局完成</div>
      <div id="bombPlus" class="bom-plus">CLEAR</div>
      <p id="bombSubtext" class="bom-subtext">本機已解牌局 +1</p>
    </div>
  </div>

  <div id="restartConfirm" class="dialog-overlay" hidden>
    <div class="dialog-card" role="dialog" aria-modal="true" aria-labelledby="restartConfirmTitle">
      <p id="restartConfirmTitle" class="dialog-title">選擇牌局</p>
      <div class="dialog-actions">
        <button id="restartCancelButton" type="button">取消</button>
        <button id="restartCurrentButton" type="button">重新開始此局</button>
      </div>
      <button id="restartConfirmButton" class="dialog-back" type="button">選擇其他牌局</button>
    </div>
  </div>

  <div id="microsoftPicker" class="dialog-overlay" hidden>
    <div class="dialog-card microsoft-picker-card" role="dialog" aria-modal="true" aria-labelledby="microsoftPickerTitle">
      <p id="microsoftPickerTitle" class="dialog-title">選擇牌局</p>
      <p class="microsoft-picker-question">要玩哪一種？</p>

      <section class="microsoft-picker-tools" aria-label="Microsoft 牌局選擇">
        <button id="randomMicrosoftButton" class="deal-button" type="button">隨機牌局</button>
        <button id="solvedMicrosoftButton" class="deal-button" type="button" aria-expanded="false" aria-controls="microsoftSolvedPanel">已解牌局</button>
        <button id="numberMicrosoftButton" class="deal-button" type="button" aria-expanded="false" aria-controls="microsoftNumberPanel">百萬牌局</button>
        <button id="hiddenMicrosoftButton" class="deal-button" type="button" aria-expanded="false" aria-controls="microsoftHiddenPanel">隱藏牌局</button>
      </section>

      <section id="microsoftNumberPanel" class="microsoft-number-block" hidden aria-label="輸入 Microsoft 牌局編號">
        <div class="microsoft-number-row">
          <input id="microsoftDealInput" type="number" min="1" max="1000000" inputmode="numeric" placeholder="1～1000000" aria-label="Microsoft 百萬牌局編號">
          <button id="loadMicrosoftButton" type="button">載入</button>
        </div>
      </section>

      <section id="microsoftHiddenPanel" class="microsoft-hidden-block" hidden aria-label="Microsoft 隱藏牌局">
        <div class="microsoft-hidden-grid">
          <button type="button" data-hidden-microsoft-deal="-1">#-1 無解</button>
          <button type="button" data-hidden-microsoft-deal="-2">#-2 無解</button>
          <button type="button" data-hidden-microsoft-deal="-3">#-3 必勝</button>
          <button type="button" data-hidden-microsoft-deal="-4">#-4 必勝</button>
        </div>
      </section>

      <section id="microsoftSolvedPanel" class="microsoft-solved-panel" hidden aria-label="本機已解牌局">
        <div id="microsoftSolvedList" class="microsoft-solved-list"></div>
        <div class="microsoft-solved-pager">
          <button id="microsoftSolvedPrev" type="button">上一頁</button>
          <span id="microsoftSolvedPageInfo">1 / 1</span>
          <button id="microsoftSolvedNext" type="button">下一頁</button>
        </div>
      </section>

      <button id="microsoftPickerBack" class="dialog-back" type="button">返回遊戲</button>
    </div>
  </div>

  <div id="message" class="message" hidden>
    <div class="message-card">
      <p id="messageTitle" class="message-title">牌局完成</p>
      <p id="messageText" class="message-text"></p>
      <p id="messageBest" class="message-best" hidden></p>
      <p id="messageClears" class="message-clears" hidden></p>
      <div id="messageUidRow" class="message-uid-row" hidden>
        <code id="messageUid" class="message-uid"></code>
        <button id="messageCopyUidButton" class="copy-icon-button message-copy-icon-button" type="button" aria-label="複製牌局編號" title="複製牌局編號"><canvas class="copy-icon-canvas" width="24" height="24" aria-hidden="true"></canvas></button>
      </div>
      <button id="playAgainButton" type="button">選擇下一局</button>
    </div>
  </div>

  <div id="copyToast" class="slowly-toast empire-copy-toast" role="status" aria-live="polite"></div>

  <script src="https://lib.stillnessbyslowly.com/game/card/deck.js"></script>
  <script src="https://lib.stillnessbyslowly.com/date/timestamp.js"></script>
  <script src="https://lib.stillnessbyslowly.com/data/random/random_id.js"></script>
  <script src="https://lib.stillnessbyslowly.com/ui/favorite.js"></script>
  <script src="https://lib.stillnessbyslowly.com/ui/toast.js"></script>

  <script src="https://lib.stillnessbyslowly.com/effects/celebration/confetti_burst.js"></script>
  <script src="https://lib.stillnessbyslowly.com/effects/celebration/gold_rain.js"></script>
  <script src="https://lib.stillnessbyslowly.com/effects/celebration/star_explosion.js"></script>
  <script src="https://lib.stillnessbyslowly.com/effects/celebration/shockwave.js"></script>
  <script src="https://lib.stillnessbyslowly.com/effects/celebration/flash_shake.js"></script>
  <script src="https://lib.stillnessbyslowly.com/effects/celebration/jackpot_pop.js"></script>
  <script src="https://lib.stillnessbyslowly.com/effects/celebration/card_rain.js"></script>
  <script src="https://lib.stillnessbyslowly.com/effects/celebration/victory_beam.js"></script>
  <script src="https://lib.stillnessbyslowly.com/effects/celebration/classic_fireworks.js"></script>

  <script src="https://lib.stillnessbyslowly.com/audio/context/context.js"></script>
  <script src="https://lib.stillnessbyslowly.com/audio/note/frequency.js"></script>
  <script src="https://lib.stillnessbyslowly.com/audio/oscillator/oscillator.js"></script>
  <script src="https://lib.stillnessbyslowly.com/audio/gain/gain.js"></script>
  <script src="https://lib.stillnessbyslowly.com/audio/gain/envelope.js"></script>
  <script src="https://lib.stillnessbyslowly.com/audio/tone/tone.js"></script>

  <script>window.FREECELL_ACTIVE_GAME_STORAGE_KEY = "freecell_microsoft_active_v1";</script>
  <script src="./microsoft_data.js"></script>
  <script src="./freecell.js?v=20261008-identitygroup"></script>
  <script src="./microsoft_style.js?v=20261008-identitygroup"></script>
  <script src="./microsoft.js?v=20261008-identitygroup"></script>
</body>
</html>
