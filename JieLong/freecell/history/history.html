<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自由之都｜歷史淵源</title>

  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/hover/lift.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/feedback/press.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/light/electric_border.css">
  <link rel="stylesheet" href="history.css?v=20261011-secret-stage-b2">
  <link rel="stylesheet" href="history_style.css?v=20261008-banner-match">
</head>
<body>
  <main class="history-shell">
    <section class="history-territory">
    <header class="history-header">
      <div class="suit-seal" aria-hidden="true">♣</div>

      <div class="history-title-copy">
        <p class="eyebrow">自由之都</p>
        <h1>新接龍 <span>FreeCell</span></h1>
      </div>

      <p class="history-header-copy">新接龍 FreeCell 歷史淵源</p>

      <button id="leaveHistoryButton" class="leave-button slowly-press" type="button">離境</button>
    </header>

    <section class="history-hero" aria-label="自由之都城堡景觀">
      <div class="sun" aria-hidden="true"></div>
      <div class="castle castle-blue" aria-hidden="true">
        <i></i><i></i><i></i><i></i>
      </div>
      <div class="fountain" aria-hidden="true">♣</div>
      <button id="historyFreeCellButton" class="art-label history-hero-label slowly-press" type="button" aria-label="返回新接龍 FreeCell">
        <strong aria-hidden="true">♣</strong><span>FREECELL</span>
      </button>
    </section>

    <section class="history-content" aria-label="新接龍歷史淵源內容分類">
      <article class="history-topic-card slowly-lift slowly-press slowly-electric-border is-active" data-history-topic>
        <span class="card-stack club" aria-hidden="true">♣</span>
        <h2>歷史淵源</h2>
      </article>

      <article class="history-topic-card slowly-lift slowly-press slowly-electric-border is-active" data-history-topic>
        <span class="card-stack club" aria-hidden="true">♣</span>
        <h2>遊玩規則</h2>
      </article>

      <article class="history-topic-card slowly-lift slowly-press slowly-electric-border is-active" data-history-topic>
        <span class="card-stack club" aria-hidden="true">♣</span>
        <h2>微軟版本</h2>
      </article>

      <article class="history-topic-card slowly-lift slowly-press slowly-electric-border is-active" data-history-topic>
        <span class="card-stack club" aria-hidden="true">♣</span>
        <h2>無解牌局</h2>
      </article>

      <button id="historyCheatButton" class="history-topic-card history-topic-button slowly-lift slowly-press slowly-electric-border is-active" data-history-topic type="button" aria-label="進入密技體驗">
        <span class="card-stack club" aria-hidden="true">♣</span>
        <h2>密技體驗</h2>
        <b class="history-topic-arrow" aria-hidden="true">›</b>
      </button>

      <article class="history-topic-card slowly-lift slowly-press slowly-electric-border is-active" data-history-topic>
        <span class="card-stack club" aria-hidden="true">♣</span>
        <h2>資料來源</h2>
      </article>
    </section>

    <nav class="history-pager" aria-label="歷史淵源分類分頁">
      <button id="historyPrevButton" class="history-page-button slowly-press" type="button" aria-label="上一頁">‹</button>
      <span id="historyPageInfo" class="history-page-info" aria-live="polite">1 / 2</span>
      <button id="historyNextButton" class="history-page-button slowly-press" type="button" aria-label="下一頁">›</button>
    </nav>
    </section>
  </main>

  <script src="https://lib.stillnessbyslowly.com/fiction/Fiction_paginate.js"></script>
  <script src="history.js?v=20261008-page3"></script>
  <script src="history_style.js?v=20261011-cheat"></script>
</body>
</html>
