<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自由之都｜歷史淵源</title>
  <link rel="stylesheet" href="history.css">
  <link rel="stylesheet" href="history_style.css">
</head>
<body>
  <main class="history-shell">
    <header class="history-header">
      <div class="history-title-group">
        <div class="suit-seal" aria-hidden="true">♣</div>
        <div>
          <p class="eyebrow">自由之都 FreeCell</p>
          <h1>歷史淵源</h1>
          <p class="subtitle">新接龍的來處，留待典藏。</p>
        </div>
      </div>
      <button id="leaveHistoryButton" class="leave-button" type="button">離境</button>
    </header>

    <section class="history-hero" aria-labelledby="historyHeroTitle">
      <div class="history-hero-mark" aria-hidden="true">♣</div>
      <div class="history-hero-copy">
        <p class="history-kicker">FREECELL ARCHIVE</p>
        <h2 id="historyHeroTitle">自由之都典藏室</h2>
        <p>史料整理中。</p>
      </div>
    </section>

    <section class="history-content" aria-label="歷史內容預留區">
      <article class="history-card">
        <span class="history-card-number">01</span>
        <div>
          <p class="history-card-label">HISTORY</p>
          <h3>新接龍由來</h3>
          <p>內容預留。之後可從這裡開始整理 FreeCell 的起源、Microsoft 版本與牌局文化。</p>
        </div>
      </article>
    </section>
  </main>

  <script src="history.js"></script>
  <script src="history_style.js"></script>
</body>
</html>
