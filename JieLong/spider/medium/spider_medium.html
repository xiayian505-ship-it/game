<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>秩序之城｜連環新接龍・中階</title>

  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/light/area_burst.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/typography/shine_text.css">
  <!-- 慢慢軍火庫｜Celebration FX -->
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/celebration/confetti_burst.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/celebration/gold_rain.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/celebration/star_explosion.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/celebration/shockwave.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/celebration/flash_shake.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/celebration/jackpot_pop.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/celebration/card_rain.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/celebration/victory_beam.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/celebration/classic_fireworks.css">
  <link rel="stylesheet" href="spider_medium.css">
  <link rel="stylesheet" href="spider_medium_style.css">
  <link rel="stylesheet" href="../spider_header.css?v=20261011-spider-hud">
  <link rel="stylesheet" href="../../select_deal_buttons.css?v=20261011-pending-tabs">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/ui/favorite.css">
  <link rel="stylesheet" href="../../personal_collection/collection_game.css?v=20261012-trove-star">
</head>
<body>
  <main id="gameShell" class="game-shell">
    <header class="game-header">
      <div class="empire-title-group">
        <div class="suit-seal" aria-hidden="true">♠</div>
        <div class="empire-title-copy">
          <p class="eyebrow eyebrow-with-stat"><span>秩序之城・中階</span><span class="city-solved-stat">玩家已解牌局：<strong id="solvedDealCount">0</strong></span></p>
          <h1>連環新接龍 <span>Spider</span></h1>
          <div class="subtitle empire-status-line">
            <div id="currentDealIdentity" class="deal-identity" hidden>
              <div class="deal-id-left">
                <button id="favoriteDealToggle" class="slowly-favorite" type="button" data-slowly-favorite aria-pressed="false" aria-label="最愛牌局" title="最愛牌局" hidden>☆</button>
                <span><strong id="currentDealShortUid">M-────────</strong></span>
                <button id="copyDealUidButton" class="copy-deal-id-button" type="button" aria-label="複製牌局 UID" title="複製牌局 UID">複製 UID</button>
              </div>
            </div>
          </div>
          <div class="deal-stats header-deal-stats" aria-live="polite">
            <span id="currentDealBest" class="deal-best" hidden>最佳：<strong id="currentDealBestSteps">—</strong> 步</span>
            <span id="currentDealClears" class="deal-clears" hidden>破關：<strong id="currentDealClearCount">—</strong> 次</span>
          </div>
        </div>
      </div>

      <div class="empire-header-actions" aria-label="領地操作">
        <button id="restartButton" class="restart-button" type="button">入境</button>
        <button id="leaveEmpireButton" class="leave-empire-button" type="button">離境</button>
      </div>
    </header>

    <!-- 仍由原有遊戲 JS 維護這兩個計數，畫面改為僅顯示步數。 -->
    <span id="completedCount" hidden>0</span>
    <span id="dealCount" hidden>0</span>


    <section class="top-row">
      <button id="stockButton" class="stock-button" type="button" aria-label="發牌">
        <span class="stock-icon">🂠</span>
        <span>發牌</span>
      </button>

      <div id="completedArea" class="completed-area" aria-label="已完成牌組"></div>
    </section>

    <div class="gameplay-step-row" aria-live="polite">步數：<strong id="moveCount">0</strong></div>

    <p id="notice" class="notice spider-status-notice" role="status" aria-live="polite">選擇一副牌局開始。</p>

    <section id="tableau" class="tableau" aria-label="十欄牌區"></section>

    <p class="hint">
      慢 慢 | Stillness by Slowly.com
    </p>
  </main>

  <div id="bombOverlay" class="bom-overlay" aria-hidden="true">
    <div id="victoryParticles" class="victory-particles" aria-hidden="true"></div>
    <div class="bom-card">
      <div id="bombText" class="bom-text slowly-shine-text">恭喜解出此牌局</div>
      <div id="bombPlus" class="bom-plus">+1</div>
      <p id="bombSubtext" class="bom-subtext">這副牌已加入玩家可解牌庫</p>
    </div>
  </div>

  <div id="restartConfirm" class="dialog-overlay" hidden>
    <div class="dialog-card" role="dialog" aria-modal="true" aria-labelledby="restartConfirmTitle">
      <p id="restartConfirmTitle" class="dialog-title">要怎麼重新開始？</p>
      <p class="dialog-text">可以重開目前這副牌，也可以改選其他牌局。</p>
      <div class="dialog-actions">
        <button id="restartCancelButton" type="button">取消</button>
        <button id="restartCurrentButton" type="button">重新開始此局</button>
      </div>
      <button id="restartConfirmButton" class="dialog-back" type="button">選擇其他牌局</button>
    </div>
  </div>

  <div id="dealPicker" class="dialog-overlay" hidden>
    <div class="dialog-card deal-picker-card" role="dialog" aria-modal="true" aria-labelledby="dealPickerTitle">
      <p id="dealPickerTitle" class="dialog-title">選擇牌局</p>
      <p class="dialog-text">要玩哪一種？</p>

      <section class="deal-tools deal-tools-main" aria-label="牌局選擇">
        <button id="randomDealButton" class="deal-button" type="button" aria-expanded="false" aria-controls="randomChoicePanel">隨機牌局</button>
        <button id="solvedDealButton" class="deal-button" type="button">玩家已解牌局</button>
        <button id="pendingDealButton" class="deal-button" type="button">待破解牌局</button>
      </section>


      <section class="deal-tools deal-tools-secondary" aria-label="其他牌局選擇">
        <button id="favoriteDealButton" class="deal-button" type="button">最愛牌局</button>
        <button id="uidDealButton" class="deal-button" type="button" aria-expanded="false" aria-controls="uidSearchPanel">輸入 UID</button>
      </section>

      <section id="randomChoicePanel" class="picker-subpanel" hidden aria-label="隨機牌局選擇">
        <div class="picker-choice-row">
          <button id="randomNewDealButton" class="deal-button" type="button">隨機開新局</button>
          <button id="randomPendingDealButton" class="deal-button" type="button">抽取未解局</button>
        </div>
      </section>

      <section id="contributedPanel" class="contributed-panel" hidden aria-label="玩家已解牌局">
        <div id="pendingChoiceTabs" class="picker-choice-row" role="group" aria-label="待破解牌局分類" hidden>
          <button id="pendingAllTab" class="deal-button" type="button" aria-pressed="true">待破解牌局</button>
          <button id="possibleUnsolvedTab" class="deal-button" type="button" aria-pressed="false">可能無解局</button>
        </div>
        <button id="randomContributedButton" class="contributed-random" type="button">從已解牌局隨機抽一局</button>

        <div id="contributedList" class="contributed-list" aria-live="polite"></div>

        <div class="contributed-pager">
          <button id="contributedPrevButton" type="button">上一頁</button>
          <span id="contributedPageInfo">1 / 1</span>
          <button id="contributedNextButton" type="button">下一頁</button>
        </div>

      </section>

        <section id="uidSearchPanel" class="uid-search" hidden>
          <label class="uid-search-label" for="uidInput">完整牌局 UID</label>
          <div class="uid-search-row">
            <input id="uidInput" type="search" autocomplete="off" spellcheck="false" placeholder="貼上 spider-medium-...">
            <button id="uidSearchButton" type="button">載入</button>
          </div>
        </section>
      <p id="dealPickerNotice" class="picker-notice" aria-live="polite"></p>
      <button id="dealPickerBackButton" class="dialog-back" type="button">返回遊戲</button>
    </div>
  </div>

  <div id="possibleMarkConfirm" class="dialog-overlay" hidden>
    <div class="dialog-card possible-mark-card" role="alertdialog" aria-modal="true" aria-labelledby="possibleMarkTitle" aria-describedby="possibleMarkDescription">
      <p id="possibleMarkTitle" class="dialog-title">標記可能無解局</p>
      <p id="possibleMarkDescription" class="dialog-text">確定要標記此牌局嗎？</p>
      <p class="possible-mark-warning">標記後無法手動取消；當有人成功破解並收錄為已解牌局時，才會自動移除。</p>
      <div class="dialog-actions">
        <button id="possibleMarkCancel" type="button">取消</button>
        <button id="possibleMarkAccept" type="button">確認標記</button>
      </div>
    </div>
  </div>

  <div id="message" class="message" hidden>
    <div class="message-card">
      <p id="messageTitle" class="message-title"></p>
      <p id="messageText" class="message-text"></p>
      <p id="messageBest" class="message-best" hidden></p>
      <p id="messageClears" class="message-clears" hidden></p>
      <div class="message-uid-row">
        <code id="messageUid" class="message-uid"></code>
        <button id="messageCopyUidButton" type="button">複製 UID</button>
      </div>
      <button id="playAgainButton" type="button">選擇下一局</button>
    </div>
  </div>

  <script src="https://lib.stillnessbyslowly.com/game/card/deck.js"></script>
  <script src="https://lib.stillnessbyslowly.com/date/timestamp.js"></script>
  <script src="https://lib.stillnessbyslowly.com/data/random/random_id.js"></script>
  <script src="https://lib.stillnessbyslowly.com/fiction/Fiction_search.js"></script>
  <script src="https://lib.stillnessbyslowly.com/effects/light/area_burst.js"></script>
  <!-- 慢慢軍火庫｜Celebration FX -->
  <script src="https://lib.stillnessbyslowly.com/effects/celebration/confetti_burst.js"></script>
  <script src="https://lib.stillnessbyslowly.com/effects/celebration/gold_rain.js"></script>
  <script src="https://lib.stillnessbyslowly.com/effects/celebration/star_explosion.js"></script>
  <script src="https://lib.stillnessbyslowly.com/effects/celebration/shockwave.js"></script>
  <script src="https://lib.stillnessbyslowly.com/effects/celebration/flash_shake.js"></script>
  <script src="https://lib.stillnessbyslowly.com/effects/celebration/jackpot_pop.js"></script>
  <script src="https://lib.stillnessbyslowly.com/effects/celebration/card_rain.js"></script>
  <script src="https://lib.stillnessbyslowly.com/effects/celebration/victory_beam.js"></script>
  <script src="https://lib.stillnessbyslowly.com/effects/celebration/classic_fireworks.js"></script>
  <!-- 慢慢的倉庫｜Audio（沿用消消樂既有音色） -->
  <script src="https://lib.stillnessbyslowly.com/audio/context/audio_context.js"></script>
  <script src="https://lib.stillnessbyslowly.com/audio/pitch/note_frequency.js"></script>
  <script src="https://lib.stillnessbyslowly.com/audio/source/oscillator.js"></script>
  <script src="https://lib.stillnessbyslowly.com/audio/gain/gain.js"></script>
  <script src="https://lib.stillnessbyslowly.com/audio/gain/envelope.js"></script>
  <script src="https://lib.stillnessbyslowly.com/audio/tone/tone.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
  <!-- 個人牌局館本機資料 Key 預留，不建立空收藏。 -->
  <script src="../../personal_collection/collection_keys.js?v=20261011-uid"></script>
  <script src="https://lib.stillnessbyslowly.com/ui/favorite.js"></script>
  <script src="../../personal_collection/collection_game.js?v=20261012-favmark"></script>
  <script src="spider_medium_db.js"></script>
  <script src="spider_medium.js?v=20261012-trove-archive"></script>
  <script src="spider_medium_style.js?v=20261012-favmark"></script>
</body>
</html>
