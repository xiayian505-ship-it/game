<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>慢 慢 | Klondike DB</title>

  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/ui/tabs/tabs.css">
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="index_style.css">
</head>
<body>
  <main class="db-shell">
    <header class="db-header">
      <h1>慢 慢 | Klondike DB</h1>
      <button id="refreshButton" class="refresh-button" type="button">重新整理</button>
    </header>

    <div id="dbTabs" class="db-tabs-shell" data-slowly-tabs>
      <nav class="db-tabs" role="tablist" aria-label="翻牌模式">
        <button type="button" role="tab" data-view-target="draw1" aria-selected="true">1 張牌</button>
        <button type="button" role="tab" data-view-target="draw3" aria-selected="false">3 張牌</button>
      </nav>

      <section class="db-panel" data-view-panel="draw1">
        <div class="panel-meta">
          <span>共 <strong id="draw1Count">—</strong> 局</span>
          <span id="draw1Status" class="status-text" aria-live="polite"></span>
        </div>
        <div id="draw1List" class="record-list"></div>
        <nav id="draw1Pager" class="pager" aria-label="1 張牌分頁" hidden>
          <button id="draw1Prev" type="button">上一頁</button>
          <span id="draw1PageInfo" class="page-info">1 / 1</span>
          <button id="draw1Next" type="button">下一頁</button>
        </nav>
      </section>

      <section class="db-panel" data-view-panel="draw3" hidden>
        <div class="panel-meta">
          <span>共 <strong id="draw3Count">—</strong> 局</span>
          <span id="draw3Status" class="status-text" aria-live="polite"></span>
        </div>
        <div id="draw3List" class="record-list"></div>
        <nav id="draw3Pager" class="pager" aria-label="3 張牌分頁" hidden>
          <button id="draw3Prev" type="button">上一頁</button>
          <span id="draw3PageInfo" class="page-info">1 / 1</span>
          <button id="draw3Next" type="button">下一頁</button>
        </nav>
      </section>
    </div>

    <footer class="hint">慢 慢 | Stillness by Slowly.com</footer>
  </main>

  <script src="https://lib.stillnessbyslowly.com/ui/tabs/tabs.js"></script>
  <script src="https://lib.stillnessbyslowly.com/fiction/Fiction_paginate.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
  <script src="index.js"></script>
  <script src="index_style.js"></script>
</body>
</html>
