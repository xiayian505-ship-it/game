<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a1022">
  <meta name="description" content="慢慢遊戲大廳。翻牌、輪播、挑一款進去玩。">
  <meta property="og:title" content="慢慢遊戲大廳｜Stillness by Slowly">
  <meta property="og:description" content="隨機登場的五張牌，與持續擴充的慢慢遊戲牌組。">
  <meta property="og:url" content="https://game.stillnessbyslowly.com/">
  <title>慢慢遊戲大廳｜Stillness by Slowly</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='72' font-size='65' font-family='serif' fill='%23bba875' text-anchor='middle'%3E慢%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://lib.stillnessbyslowly.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/ui/responsive.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/background/aurora.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/background/starfield.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/line/enso_ring.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/particle/orbit.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/particle/atom_bob.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/particle/float.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/light/breathing_glow.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/light/flowing_border.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/background/grid_overlay.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/celebration/star_explosion.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/light/decorative_glow.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/light/button_shine.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/typography/shine_text.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/typography/text_gradient_flow.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/celebration/click_burst.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/stage/portal_wipe.css">
  <link rel="stylesheet" href="./index.css">
  <link rel="stylesheet" href="./index_style.css">

  <script src="https://lib.stillnessbyslowly.com/effects/background/starfield.js" defer></script>
  <script src="https://lib.stillnessbyslowly.com/effects/celebration/star_explosion.js" defer></script>
  <script src="https://lib.stillnessbyslowly.com/effects/celebration/click_burst.js" defer></script>
  <script src="https://lib.stillnessbyslowly.com/effects/stage/portal_wipe.js" defer></script>
  <script src="./index.js" defer></script>
  <script src="./index_style.js" defer></script>
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="slowly-aurora"><span></span><span></span><span></span></div>
    <div class="sbs-stars" data-count="55" data-color="#fff9e8"><canvas></canvas></div>
  </div>

  <div class="page">
    <main id="main">
      <header class="hero wrap">
        <h1 class="hero-art-title"><img src="https://img.stillnessbyslowly.com/images/2026/10/c03304c4-5ad7-4718-b2bf-74c37c9513c5_%E6%85%A2%E6%85%A2%E9%81%8A%E6%88%B2_aurora_horizontal_2x.png" alt="慢慢遊戲大廳" width="2400" height="1520" decoding="async" fetchpriority="high"></h1>
      </header>

      <section class="showcase wrap" id="featured" aria-labelledby="showcase-title">
        <h2 id="showcase-title" class="visually-hidden">本輪抽選</h2>

        <div class="spotlight" id="spotlight" data-effect-slot="1" aria-label="遊戲展示舞台">
          <div class="stage-fx">
            <div class="fx fx--celestial">
              <div class="fx-enso sbs-enso"><svg viewBox="0 0 240 240"><circle cx="120" cy="120" r="97" stroke-width="1.4" pathLength="100"/><circle cx="120" cy="120" r="110" stroke-width=".7" pathLength="100"/></svg></div>
              <div class="fx-orbit-position"><div class="fx-orbit sbs-orbit"><span></span></div></div>
              <i class="fx-star fx-star--a"></i><i class="fx-star fx-star--b"></i><i class="fx-star fx-star--c"></i>
            </div>
            <div class="fx fx--portal">
              <div class="fx-gate-position"><div class="fx-gate sbs-flowborder"><div class="fx-gate-inner sbs-flowborder-inner"></div></div></div>
              <i class="fx-gate-spark fx-gate-spark--a"></i><i class="fx-gate-spark fx-gate-spark--b"></i>
            </div>
            <!-- 03 網格疊層放於卡面；星光爆發由軍火庫 JS 在切牌時觸發。 -->
            <div class="fx fx--dust slowly-dual-glow">
              <span class="fx-dust-haze"></span>
              <span class="fx-particle slowly-particle-float" style="--px:14%;--py:22%;--i:0"></span>
              <span class="fx-particle slowly-particle-float" style="--px:27%;--py:59%;--i:1"></span>
              <span class="fx-particle slowly-particle-float" style="--px:36%;--py:13%;--i:2"></span>
              <span class="fx-particle slowly-particle-float" style="--px:57%;--py:78%;--i:3"></span>
              <span class="fx-particle slowly-particle-float" style="--px:70%;--py:18%;--i:4"></span>
              <span class="fx-particle slowly-particle-float" style="--px:85%;--py:46%;--i:5"></span>
              <span class="fx-particle slowly-particle-float" style="--px:20%;--py:78%;--i:6"></span>
              <span class="fx-particle slowly-particle-float" style="--px:77%;--py:69%;--i:7"></span>
              <span class="fx-particle slowly-particle-float" style="--px:49%;--py:27%;--i:8"></span>
              <span class="fx-particle slowly-particle-float" style="--px:91%;--py:22%;--i:9"></span>
            </div>
            <div class="fx fx--sunburst">
              <div class="fx-sun-wheel"></div>
              <span class="fx-sun-streak fx-sun-streak--a"></span>
              <span class="fx-sun-streak fx-sun-streak--b"></span>
            </div>
          </div>

          <article class="feature-card" id="feature-card">
            <div class="slot-grid slowly-grid-overlay" aria-hidden="true"></div>
            <div class="card-topline">
              <span class="card-category" id="stage-category">遊戲分類</span>
              <span class="card-number" id="slide-index">01</span>
            </div>
            <div class="card-visual">
              <div class="card-visual-halo" aria-hidden="true"></div>
              <span class="art-icon" id="stage-icon" aria-hidden="true">✦</span>
            </div>
            <div class="card-body">
              <h3 id="stage-name">慢慢遊戲大廳</h3>
              <p class="stage-description" id="stage-description">正在準備本輪的遊戲牌……</p>
            </div>
            <a class="play-link sbs-shine" id="play-link" href="#all" aria-label="進入遊戲">▶</a>
          </article>
        </div>

        <div class="stage-hand-controls">
          <button class="hand-arrow hand-arrow--prev stage-hand-arrow" type="button" id="prev" aria-label="上一款遊戲" aria-controls="stage-nav">‹</button>
          <div class="stage-nav hand-row" id="stage-nav" role="group" aria-label="本輪抽選的五張牌"></div>
          <button class="hand-arrow hand-arrow--next stage-hand-arrow" type="button" id="next" aria-label="下一款遊戲" aria-controls="stage-nav">›</button>
        </div>
      </section>

      <section class="collection wrap" id="all" aria-label="遊戲手牌">
        <div class="hand-carousel">
          <button class="hand-arrow hand-arrow--prev" id="hand-prev" type="button" aria-label="查看前面的遊戲手牌" aria-controls="hand-viewport">‹</button>
          <div class="hand-viewport" id="hand-viewport" tabindex="0" role="region" aria-label="遊戲手牌，可左右滑動或使用左右方向鍵">
            <div class="game-hand hand-row" id="grid" aria-label="全部遊戲"></div>
          </div>
          <button class="hand-arrow hand-arrow--next" id="hand-next" type="button" aria-label="查看後面的遊戲手牌" aria-controls="hand-viewport">›</button>
        </div>
        <p class="empty" id="empty" hidden>沒有符合的牌。</p>
        <div class="load-status" id="load-status" role="status" hidden>
          遊戲清單讀取失敗。
          <button type="button" id="retry">重新讀取</button>
        </div>
      </section>
    </main>
    <footer class="site-footer"><p>慢 慢 | Stillness by Slowly</p></footer>
  </div>
</body>
</html>
