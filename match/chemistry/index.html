<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8"/>
    <meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
    <title>
      慢慢化學實驗室
    </title>
    <link href="https://lib.stillnessbyslowly.com/ui/responsive.css" rel="stylesheet"/>
    <link href="https://lib.stillnessbyslowly.com/ui/confirm/confirm.css" rel="stylesheet"/>
    <link href="https://lib.stillnessbyslowly.com/effects/feedback/press.css" rel="stylesheet"/>
    <link href="https://lib.stillnessbyslowly.com/ui/custom_select.css" rel="stylesheet"/>
    <link href="sbs_chemistry_v1.css" rel="stylesheet"/>
    <link href="style/sbs_chemistry_v1_ui_style.css" rel="stylesheet"/>
    <link href="function/sbs_chemistry_v1_game_function.css" rel="stylesheet"/>
    <link href="interact/sbs_chemistry_v1_game_interact.css" rel="stylesheet"/>
  </head>
  <body>
    <main class="shell">
      <header>
        <h1>
          慢 慢 | 化學實驗室
        </h1>
      </header>
      <div class="page-nav-row">
        <nav aria-label="實驗室頁面" class="view-tabs" role="tablist">
          <button
            aria-controls="settingsView"
            aria-selected="false"
            class="view-tab slowly-press"
            data-view-target="settings"
            id="tab-settings"
            role="tab"
            type="button"
          >
            設定
          </button>
          <button
            aria-controls="gameView"
            aria-selected="true"
            class="view-tab slowly-press"
            data-view-target="game"
            id="tab-game"
            role="tab"
            type="button"
          >
            遊戲
          </button>
          <button
            aria-controls="achievementsView"
            aria-selected="false"
            class="view-tab slowly-press"
            data-view-target="achievements"
            id="tab-achievements"
            role="tab"
            type="button"
          >
            成就
          </button>
        </nav>
        <a class="home-link" href="https://game.stillnessbyslowly.com/">
          回家
        </a>
      </div>
      <section
        aria-labelledby="tab-settings"
        class="view-panel settings-panel"
        data-view-panel="settings"
        hidden=""
        id="settingsView"
        role="tabpanel"
      >
        <h2>
          設定
        </h2>
        <div class="setting-mode">
          <label for="chemistryMode">
            遊戲模式
          </label>
          <select
            aria-describedby="chemistryModeNote"
            aria-label="遊戲模式"
            data-slowly-select=""
            id="chemistryMode"
          >
            <option value="normal">
              普通模式・第 1 關開始
            </option>
            <option value="endless">
              無盡模式・第 14 關開始
            </option>
          </select>
          <p aria-live="polite" id="chemistryModeNote">
            普通模式從第 1 關開始；請到遊戲頁按「開始」。
          </p>
        </div>
        <button class="panel-button slowly-press" id="settingsHelp" type="button">
          玩法說明
        </button>
      </section>
      <section aria-labelledby="tab-game" class="view-panel" data-view-panel="game" id="gameView" role="tabpanel">
        <div aria-label="遊戲控制" class="game-controls">
          <button class="game-control slowly-press" id="btnStart" type="button">
            開始
          </button>
          <button class="game-control slowly-press" disabled="" id="btnPause" type="button">
            暫停
          </button>
          <button class="game-control slowly-press" disabled="" id="btnEnd" type="button">
            結束
          </button>
        </div>
        <section class="game-overview">
          <section aria-label="本關合成表" class="recipe-tree">
            <button
              aria-controls="recipeContent"
              aria-expanded="false"
              class="recipe-toggle"
              id="recipeToggle"
              type="button"
            >
              本關合成表
            </button>
            <div class="recipe-content" hidden="" id="recipeContent">
              <div class="recipes" id="recipes">
              </div>
              <p class="hint warning" id="danger">
              </p>
            </div>
          </section>
          <div class="stats">
            <div>
              關卡
              <strong id="level">
                1
              </strong>
            </div>
            <div>
              本關分數
              <strong id="score">
                0 / 3
              </strong>
            </div>
            <div>
              累計分數
              <strong id="total">
                0
              </strong>
            </div>
            <div>
              剩餘原子
              <strong id="remaining">
                12
              </strong>
            </div>
          </div>
        </section>
        <div class="progress">
          <div id="progress">
          </div>
        </div>
        <p class="mode-indicator" id="modeIndicator">
          普通模式｜第 1 關（尚未開始）
        </p>
        <section class="game">
          <div class="left">
            <div class="queue">
              <div>
                <span class="small">
                  目前原子
                </span>
                <div class="atom large" id="current">
                </div>
              </div>
              <div>
                <span class="small">
                  接下來
                </span>
                <div class="next" id="next">
                </div>
              </div>
            </div>
            <div class="board-toolbar">
              <button class="restart-link slowly-press" id="saveScore" type="button">
                分數紀錄
              </button>
              <button class="restart-link slowly-press" id="restart" type="button">
                重新開始
              </button>
            </div>
            <div class="board-wrap">
              <div aria-label="六乘六原子棋盤" class="board" id="board">
              </div>
            </div>
            <p aria-live="polite" class="message" id="message">
              點擊空格放入原子，相鄰的原子可以合成分子！
            </p>
          </div>
        </section>
      </section>
      <section
        aria-labelledby="tab-achievements"
        class="view-panel achievements-panel"
        data-view-panel="achievements"
        hidden=""
        id="achievementsView"
        role="tabpanel"
      >
        <h2>
          成就
        </h2>
        <div class="achievement-stats">
          <div>
            目前關卡
            <strong id="achievementLevel">
              1
            </strong>
          </div>
          <div>
            累計分數
            <strong id="achievementTotal">
              0
            </strong>
          </div>
        </div>
        <section aria-labelledby="rankTitle" class="ranking-panel">
          <h3 id="rankTitle">
            排行榜
          </h3>
          <p>
            普通與無盡模式各自保存本機 TOP 3；同一場多次記錄只更新同一筆成績。
          </p>
          <div aria-label="排行榜模式" class="rank-mode-tabs" role="tablist">
            <button aria-selected="true" class="rank-mode-tab" data-rank-mode="normal" role="tab" type="button">
              普通模式
            </button>
            <button aria-selected="false" class="rank-mode-tab" data-rank-mode="endless" role="tab" type="button">
              無盡模式
            </button>
          </div>
          <div aria-live="polite" class="rankList" id="rankList">
          </div>
        </section>
      </section>
      <footer>
        慢 慢 | Stillness by Slowly
      </footer>
    </main>
    <dialog id="modal">
      <h2 id="modalTitle">
        玩法說明
      </h2>
      <div id="modalBody">
      </div>
      <button id="modalClose">
        知道了
      </button>
    </dialog>
    <script src="https://lib.stillnessbyslowly.com/data/random/random.js">
    </script>
    <script src="https://lib.stillnessbyslowly.com/fiction/Fiction_filter.js">
    </script>
    <script src="https://lib.stillnessbyslowly.com/fiction/Fiction_sort.js">
    </script>
    <script src="https://lib.stillnessbyslowly.com/fiction/Fiction_storage.js">
    </script>
    <script src="https://lib.stillnessbyslowly.com/fiction/Fiction_paginate.js">
    </script>
    <script src="https://lib.stillnessbyslowly.com/date/timer/elapsed_format.js">
    </script>
    <script src="https://lib.stillnessbyslowly.com/date/timer/phase_cycle.js">
    </script>
    <script src="https://lib.stillnessbyslowly.com/ui/confirm/confirm.js">
    </script>
    <script src="https://lib.stillnessbyslowly.com/state/tree_selection.js">
    </script>
    <script src="https://lib.stillnessbyslowly.com/ui/custom_select.js">
    </script>
    <script src="sbs_chemistry_v1.js">
    </script>
    <script src="function/sbs_chemistry_v1_game_function.js">
    </script>
    <script src="style/sbs_chemistry_v1_ui_style.js">
    </script>
    <script src="interact/sbs_chemistry_v1_game_interact.js">
    </script>
  </body>
</html>
