<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="none"><defs>
<linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1c2d"/><stop offset=".5" stop-color="#102c39"/><stop offset="1" stop-color="#08181e"/></linearGradient>
<radialGradient id="moon"><stop stop-color="#d9ead4" stop-opacity=".48"/><stop offset="1" stop-color="#a9d5c7" stop-opacity="0"/></radialGradient>
<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1c3537"/><stop offset=".5" stop-color="#213735"/><stop offset="1" stop-color="#111d21"/></linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#2b3532"/><stop offset="1" stop-color="#090e14"/></linearGradient>
<linearGradient id="wood" x1="0" y1="0" x2="1" y2=".4"><stop stop-color="#392622"/><stop offset=".48" stop-color="#6d4740"/><stop offset="1" stop-color="#1c2324"/></linearGradient>
<linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e4c787"/><stop offset=".48" stop-color="#846a4a"/><stop offset="1" stop-color="#dac19a"/></linearGradient>
<linearGradient id="robe" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a121b"/><stop offset=".5" stop-color="#1c2b30"/><stop offset="1" stop-color="#070d13"/></linearGradient>
<radialGradient id="goldglow"><stop stop-color="#e8c982" stop-opacity=".42"/><stop offset="1" stop-color="#ffdb88" stop-opacity="0"/></radialGradient>
<filter id="blur"><feGaussianBlur stdDeviation="18"/></filter><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".36" numOctaves="3" seed="8" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".095"/></feComponentTransfer></filter>
