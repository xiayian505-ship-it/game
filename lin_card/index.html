<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#081c1d">
  <meta name="description" content="霧林之契｜慢慢好玩遊戲區的十關策略卡牌試煉。昔日所棄，終將與你為敵">
  <title>霧林之契｜Stillness by Slowly</title>
  <!-- 慢慢軍火庫：HTTPS 絕對網址，零件功能由軍火庫提供，外觀由本專案控制。 -->
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/ui/responsive.css">
  <link rel="stylesheet" href="./game/game.css">
  <link rel="stylesheet" href="./game/game_ui.css">
  <link rel="stylesheet" href="./game/boss_card_animation.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/celebration/flash_shake.css">
  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/effects/celebration/shockwave.css">
  <link rel="stylesheet" href="./game/battle_fx.css">
  <link rel="stylesheet" href="./site.css">
  <link rel="stylesheet" href="./opening/opening.css">
  <script src="https://lib.stillnessbyslowly.com/state/tree_selection.js" defer></script>
  <script src="https://lib.stillnessbyslowly.com/game/card/deck.js" defer></script>
  <script src="https://lib.stillnessbyslowly.com/effects/background/pine_forest.js" defer></script>
  <script src="https://lib.stillnessbyslowly.com/effects/background/fog.js" defer></script>
  <!-- 軍火庫：畫面效果、音訊 Context / Noise / Chime 直接 HTTPS 引用。 -->
  <script src="https://lib.stillnessbyslowly.com/effects/celebration/flash_shake.js" defer></script>
  <script src="https://lib.stillnessbyslowly.com/effects/celebration/shockwave.js" defer></script>
  <script src="https://lib.stillnessbyslowly.com/audio/context/audio_context.js" defer></script>
  <script src="https://lib.stillnessbyslowly.com/audio/source/noise.js" defer></script>
  <script src="https://lib.stillnessbyslowly.com/audio/tone/harmonic_chime.js" defer></script>
  <!-- 遊戲資料與戰鬥：不因更換開場而改變規則。 -->
  <script src="./game/cards.js" defer></script>
  <script src="./game/save.js" defer></script>
  <script src="./game/battle_rules.js" defer></script>
  <script src="./story/story_config.js" defer></script>
  <script src="https://lib.stillnessbyslowly.com/state/navigation/navigation.js" defer></script>
  <script src="./story/story_bridge.js" defer></script>
  <script src="./game/game.js" defer></script>
  <script src="./game/game_ui.js" defer></script>
  <script src="./game/boss_card_animation.js" defer></script>
  <script src="./game/battle_haptics.js" defer></script>
  <script src="./game/battle_fx.js" defer></script>
  <!-- 獨立開場：風雨聲在玩家操作後才可播放。 -->
  <script src="./opening/ambience.js" defer></script>
  <script src="./opening/opening.js" defer></script>
</head>
<body>
  <section class="wf-opening" id="wf-opening" aria-label="霧林之契開場">
    <div class="wf-opening-bg" aria-hidden="true"></div>
    <div class="wf-opening-tint" aria-hidden="true"></div>
    <div class="wf-opening-mist is-far" aria-hidden="true"></div>
    <div class="wf-opening-mist" aria-hidden="true"></div>
    <canvas class="wf-opening-rain" id="wf-weather" aria-hidden="true"></canvas>
    <div class="wf-opening-edge" aria-hidden="true"></div>
    <div class="wf-opening-content">
      <button class="wf-opening-title" id="wf-enter" type="button" aria-label="點擊霧林之契，進入遊戲">
        <img class="wf-opening-title-art" src="https://img.stillnessbyslowly.com/images/2026/10/8fc36708-5295-4ac4-aa2f-0adb3f0c781d_%E9%9C%A7%E6%9E%97%E4%B9%8B%E5%A5%91001.png" alt="霧林之契" width="1400" height="560" fetchpriority="high" decoding="async">
        <span class="wf-opening-title-fallback" aria-hidden="true">霧林之契</span>
      </button>
      <span class="wf-opening-divider" aria-hidden="true"></span>
      <p class="wf-opening-subtitle">The Forest Keeps What You Leave Behind</p>
      <p class="wf-opening-caption">觸碰名字，踏入霧林</p>
    </div>
    <div class="wf-opening-controls">
      <button id="wf-sound" class="wf-sound-btn" type="button" aria-pressed="false">♫ 開啟風雨聲</button>
    </div>
    <div class="wf-opening-footer">慢 慢 | Stillness by Slowly</div>
  </section>

  <!-- 進場後才顯示：保留既有的「旅人的選擇」主選單、關卡、個人牌組與戰鬥。 -->
  <div class="wf-game" id="wf-game" tabindex="-1" hidden>
    <div class="lc-scene" aria-hidden="true"><canvas id="lin-forest"></canvas><canvas id="lin-fog"></canvas><div class="lc-scene-shade"></div></div>
    <div class="lc-shell">
      <main>
        <section class="lc-intro">
          <div class="lc-title-art-frame">
            <img class="lc-title-art" src="https://img.stillnessbyslowly.com/images/2026/10/8fc36708-5295-4ac4-aa2f-0adb3f0c781d_%E9%9C%A7%E6%9E%97%E4%B9%8B%E5%A5%91001.png" alt="霧林之契" width="1400" height="560" decoding="async">
          </div>
          <h1>霧林之契</h1>
          <p class="lc-motto">
            <img class="lc-motto-art" src="./assets/motto.svg" alt="昔日所棄，終將與你為敵" width="2000" height="395" decoding="async">
            <span class="lc-motto-fallback" aria-hidden="true">昔日所棄，終將與你為敵</span>
          </p>
          <p class="lc-en lc-en-under-motto">The Forest Keeps What You Leave Behind</p>
          <div class="lc-line" aria-hidden="true"></div>
        </section>
        <div class="lc-overview" id="game-overview"><div><span>已通過</span><strong id="chapter-count">0 / 10</strong></div><div><span>Boss 永久牌庫</span><strong id="boss-count">105</strong></div><div><span>遊戲狀態</span><strong>試玩版 v0.8.5</strong></div></div>
        <div id="progress" aria-label="關卡進度"></div>
        <p id="status-message" class="lc-message" role="status" aria-live="polite">載入遊戲中……</p>
        <section id="app" class="lc-game" aria-label="卡牌遊戲"></section>
      </main>
      <footer class="lc-footer">慢 慢 | Stillness by Slowly</footer>
    </div>
  </div>
</body>
</html>
